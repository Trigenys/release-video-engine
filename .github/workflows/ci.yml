name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Pages Functions
        run: npm run typecheck:functions

      - name: Validate early-access contract
        run: npm run validate:funnel

      - name: Validate showcase data
        run: npm run validate:showcases

      - name: Validate creative template registry
        run: npm run validate:templates

      - name: Build
        run: npm run build

      - name: Validate public GitHub release ingestion
        run: npm run validate:ingestion
