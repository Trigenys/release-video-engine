name: AppFactory Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - "functions/api/early-access.ts"
      - "functions/api/early-access-health.ts"
      - "functions/lib/early-access-schema.ts"
      - "migrations/0001_early_access.sql"
      - ".github/workflows/appfactory-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-video-engine-infrastructure
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production D1 health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/health.json" \
              --write-out "%{http_code}" \
              --header "Cache-Control: no-cache" \
              "https://release-video-engine.pages.dev/api/early-access-health" || true)"
            if [[ "$status" == "200" ]] && jq -e '.ok == true' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Pages D1 health endpoint did not become healthy."
          cat "$RUNNER_TEMP/health.json" || true
          exit 1

      - name: Verify production persistence and idempotency
        env:
          FUNNEL_BASE_URL: https://release-video-engine.pages.dev
        run: node scripts/smoke-early-access.mjs
