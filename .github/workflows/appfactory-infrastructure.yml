name: AppFactory Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "functions/api/early-access.ts"
      - "functions/api/early-access-health.ts"
      - "migrations/0001_early_access.sql"
      - ".github/workflows/appfactory-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-video-engine-infrastructure
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      APPFACTORY_URL: https://appfactory-api.lawrynnjennifer.workers.dev
      OIDC_AUDIENCE: appfactory-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provision Pages D1 through AppFactory
        id: appfactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          request_file="$RUNNER_TEMP/release-video-engine-infrastructure.json"
          response_file="$RUNNER_TEMP/release-video-engine-infrastructure-response.json"

          jq -n '{
            repository: "Trigenys/release-video-engine",
            recipe: "early-access-leads"
          }' > "$request_file"

          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$request_file" \
              "$APPFACTORY_URL/infrastructure/pages-d1"
          )"

          rm -f "$request_file"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::AppFactory Pages D1 provisioning returned HTTP $http_code."
            jq '{error, message, requiredPermissions}' "$response_file" || true
            exit 1
          fi

          pages_url="$(jq -r '.infrastructure.pages.url // empty' "$response_file")"
          database_id="$(jq -r '.infrastructure.database.id // empty' "$response_file")"
          deployment_id="$(jq -r '.infrastructure.pages.deploymentId // empty' "$response_file")"

          if [[ -z "$pages_url" || -z "$database_id" || -z "$deployment_id" ]]; then
            echo "::error::AppFactory response is missing Pages/D1 deployment outputs."
            cat "$response_file"
            exit 1
          fi

          echo "pages_url=$pages_url" >> "$GITHUB_OUTPUT"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          {
            echo "## AppFactory Pages + D1"
            echo
            echo "- Cloudflare credentials: owned by AppFactory"
            echo "- Pages: $pages_url"
            echo "- D1: $database_id"
            echo "- Binding: LEADS_DB"
            echo "- Deployment: $deployment_id"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for production health
        shell: bash
        env:
          PAGES_URL: ${{ steps.appfactory.outputs.pages_url }}
        run: |
          set -euo pipefail

          for attempt in {1..45}; do
            status="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/health.json" \
                --write-out "%{http_code}" \
                --header "Cache-Control: no-cache" \
                "${PAGES_URL%/}/api/early-access-health" || true
            )"

            if [[ "$status" == "200" ]] && jq -e '.ok == true' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi

            sleep 4
          done

          echo "::error::Pages D1 health endpoint did not become healthy."
          cat "$RUNNER_TEMP/health.json" || true
          exit 1

      - name: Verify production persistence and idempotency
        env:
          FUNNEL_BASE_URL: ${{ steps.appfactory.outputs.pages_url }}
        run: node scripts/smoke-early-access.mjs
