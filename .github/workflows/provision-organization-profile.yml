name: Provision Trigenys organization profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".profile-bootstrap/request.json"

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        env:
          OIDC_AUDIENCE: appfactory-api
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provision public organization profile
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          payload='{
            "name": "Trigenys GitHub Profile",
            "slug": ".github",
            "projectType": "profile",
            "private": false,
            "language": "en",
            "description": "Trigenys organization profile and public GitHub community metadata."
          }'

          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --data "$payload" \
              "https://appfactory-api.lawrynnjennifer.workers.dev/projects"
          )"

          cat "$response_file"

          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "::error::AppFactory returned HTTP $http_code."
            exit 1
          fi

          repository="$(jq -r '.repository // empty' "$response_file")"
          if [[ "$repository" != "Trigenys/.github" ]]; then
            echo "::error::Unexpected repository: $repository"
            exit 1
          fi
