name: Render Atelier Maître quick demo

on:
  pull_request:
    branches: [main]
    paths:
      - "video/data/atelierMaitreQuick.ts"
      - "video/Root.tsx"
      - "scripts/render-atelier-maitre-quick.mjs"
      - ".github/workflows/render-atelier-maitre-quick-demo.yml"
      - "video/ProductDemoVideo.tsx"
      - "video/contracts/productDemo.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck video code
        run: npm run typecheck:video

      - name: Render Atelier Maître quick demo
        run: node scripts/render-atelier-maitre-quick.mjs

      - name: Verify quick demo
        run: |
          test -s out/atelier-maitre/atelier-maitre-demo-rapide-fr.mp4
          test -s out/atelier-maitre/quick-render-summary.json

      - name: Upload quick demo
        uses: actions/upload-artifact@v4
        with:
          name: atelier-maitre-quick-demo
          path: |
            out/atelier-maitre/atelier-maitre-demo-rapide-fr.mp4
            out/atelier-maitre/quick-render-summary.json
          if-no-files-found: error
          retention-days: 14
