name: Unit economics

on:
  push:
    branches: [main]
    paths:
      - "economics/**"
      - "scripts/lib/unit-economics.mjs"
      - "scripts/calculate-unit-economics.mjs"
      - "scripts/validate-unit-economics.mjs"
      - "package.json"
      - ".github/workflows/unit-economics.yml"
  pull_request:
    branches: [main]
    paths:
      - "economics/**"
      - "scripts/lib/unit-economics.mjs"
      - "scripts/calculate-unit-economics.mjs"
      - "scripts/validate-unit-economics.mjs"
      - "package.json"
      - ".github/workflows/unit-economics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate cost model
        run: npm run economics:validate

      - name: Generate unit economics report
        run: npm run economics:report

      - name: Verify report outputs
        run: |
          test -s out/unit-economics-report.json
          test -s out/unit-economics-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: release-video-engine-unit-economics
          path: |
            out/unit-economics-report.json
            out/unit-economics-report.md
          if-no-files-found: error
          retention-days: 30
